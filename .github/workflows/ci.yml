name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Verify environment dependencies
        run: python -m pip check
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Type check
        run: mypy src/pynetworkkit
      - name: Repository security hygiene
        run: python scripts/check_repository_hygiene.py
      - name: Tests and branch coverage
        run: >-
          python -m pytest -q --cov=pynetworkkit --cov-branch
          --cov-report=term-missing --cov-report=xml:coverage.xml
          --cov-fail-under=95 --junitxml=pytest-results.xml
      - name: Upload test and coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-${{ runner.os }}-py${{ matrix.python-version }}
          path: |
            pytest-results.xml
            coverage.xml
          if-no-files-found: ignore
          retention-days: 14
      - name: Build distribution
        run: python -m build
      - name: Verify distribution metadata
        run: python -m twine check dist/*
