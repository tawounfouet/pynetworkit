name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Verify environment dependencies
        run: python -m pip check
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Type check
        run: mypy src/pynetworkkit
      - name: Repository security hygiene
        run: python scripts/check_repository_hygiene.py
      - name: Tests and branch coverage
        run: >-
          python -m pytest -q --cov=pynetworkkit --cov-branch
          --cov-report=term-missing --cov-report=xml:coverage.xml
          --cov-fail-under=95 --junitxml=pytest-results.xml
      - name: Build distribution
        run: python -m build
      - name: Verify distribution metadata
        run: python -m twine check dist/*
      - name: Verify isolated wheel and create SHA256 manifest
        run: python scripts/verify_distribution.py
      - name: Upload tests, coverage and candidate hashes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-evidence-${{ runner.os }}-py${{ matrix.python-version }}
          path: |
            pytest-results.xml
            coverage.xml
            release-evidence/SHA256SUMS.txt
          if-no-files-found: ignore
          retention-days: 14
