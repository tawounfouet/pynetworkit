name: M2 candidate security audit (NO PUBLISH)

on:
  push:
    branches: [main]
    paths:
      - 'src/pynetworkkit/**'
      - 'pyproject.toml'
      - 'CHANGELOG.md'
      - '.github/workflows/m2-candidate-audit.yml'
      - 'docs/releases/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m2-candidate-audit
  cancel-in-progress: false

jobs:
  candidate:
    if: github.ref == 'refs/heads/main'
    name: M2 audit / Ubuntu / Python 3.11
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - name: Verify source candidate version without tags
        run: python -c "from pathlib import Path; p=Path('src/pynetworkkit/__init__.py').read_text(); assert '__version__ = \"0.2.0a1\"' in p"
      - name: Install patched toolchain and auditable dependencies
        run: |
          python -m pip install --upgrade 'setuptools>=84.1.0'
          python -m pip install -e '.[dev]'
          python -m pip install pip-audit
          python -m pip check
      - name: Dependency vulnerability gate
        run: pip-audit --local
      - name: Quality controls
        run: |
          ruff check .
          ruff format --check .
          mypy src/pynetworkkit
          python scripts/check_repository_hygiene.py
          python -m pytest -q --cov=pynetworkkit --cov-branch --cov-fail-under=95
      - name: Build and validate metadata
        run: |
          python -m build
          python -m twine check dist/*
          python scripts/verify_distribution.py
      - name: Verify candidate SHA256 hashes
        run: cd dist && sha256sum -c ../release-evidence/SHA256SUMS.txt
      - name: Upload candidate evidence (not published)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pynetworkkit-0.2.0a1-candidate-${{ github.sha }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            release-evidence/SHA256SUMS.txt
          if-no-files-found: ignore
          retention-days: 14
