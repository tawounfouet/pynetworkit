name: Release candidate audit (NO PUBLISH)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-candidate-audit
  cancel-in-progress: false

jobs:
  candidate:
    if: github.ref == 'refs/heads/main'
    name: Candidate audit / Python 3.11
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - name: Require expected development version
        run: |
          python -c "import pathlib; p=pathlib.Path('src/pynetworkkit/__init__.py').read_text(); assert '__version__ = \"0.1.0a2\"' in p, 'Unexpected source version'"
      - name: Install candidate build and audit tools
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install pip-audit
          python -m pip check
      - name: Audit installed build and development dependencies
        run: pip-audit --local
      - name: Check source and package quality
        run: |
          ruff check .
          ruff format --check .
          mypy src/pynetworkkit
          python scripts/check_repository_hygiene.py
          python -m pytest -q --cov=pynetworkkit --cov-branch --cov-fail-under=95
      - name: Build candidate
        run: python -m build
      - name: Validate package metadata
        run: python -m twine check dist/*
      - name: Verify isolated wheel and calculate digests
        run: python scripts/verify_distribution.py
      - name: Validate digest manifest against candidate distributions
        run: cd dist && sha256sum -c ../release-evidence/SHA256SUMS.txt
      - name: Upload candidate artifacts and digest manifest (not published)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pynetworkkit-0.1.0a2-candidate-${{ github.sha }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            release-evidence/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
